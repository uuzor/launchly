[package]
name = "launchly-token"
version = "0.1.0"
edition = "2021"
description = "NEP-141 fungible token with minter-controlled supply, one instance per Launchly product coin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
