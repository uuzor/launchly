[package]
name = "launchly"
version = "0.1.0"
edition = "2021"
description = "Launchly: per-product memecoins on bonding curves whose trading fees fund creator promotion pools"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
uint = "0.10"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
near-primitives = "=0.38.0"
near-crypto = "=0.38.0"
near-api = "0.8.6"
near-sandbox = "0.3"
cargo-near-build = "0.11"
tokio = { version = "1", features = ["full"] }
serde = "1"
serde_json = "1"
anyhow = "1"
